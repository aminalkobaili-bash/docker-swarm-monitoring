global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert_rules.yml

# Куда Prometheus отправляет сработавшие алерты
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Java-сервисы приложения (стек myapp), метрики Micrometer
  - job_name: spring-services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - booking-service:8083
          - report-service:8086
          - gateway-service:8087
          - session-service:8081

  # global-сервисы: tasks.<имя> возвращает IP каждого контейнера, т.е. каждой ноды
  - job_name: node-exporter
    dns_sd_configs:
      - names: ["tasks.node-exporter"]
        type: A
        port: 9100

  - job_name: cadvisor
    dns_sd_configs:
      - names: ["tasks.cadvisor"]
        type: A
        port: 8080

  # Доступность google.com: Prometheus опрашивает blackbox, передавая цель в параметре target
  - job_name: blackbox-google
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ["https://google.com"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
