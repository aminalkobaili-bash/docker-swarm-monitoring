auth_enabled: false

server:
  http_listen_port: 3100

# Один экземпляр Loki: индекс и логи хранятся в локальной файловой системе (том loki-data)
common:
  # Иначе Loki возьмёт IP сети ingress Swarm и не сможет подключиться сам к себе
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h
