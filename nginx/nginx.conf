events {}

http {
    # Встроенный DNS Docker Swarm
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 8081;
        location / {
            # Используем переменную для динамического резолва
            set $session_service http://session-service:8081;
            proxy_pass $session_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

    server {
        listen 8087;
        location / {
            set $gateway_service http://gateway-service:8087;
            proxy_pass $gateway_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # Book Hotel синхронно обрабатывает 61 день (~250 внутренних запросов),
            # на слабом стенде это дольше дефолтных 60 секунд
            proxy_connect_timeout 30s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }
    }
}